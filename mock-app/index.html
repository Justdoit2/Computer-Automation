<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Harbor CU Core — Member Inquiry</title>
    <style>
      body {
        margin: 0;
        background: #c0c0c0;
        font-family: Tahoma, Verdana, sans-serif;
        font-size: 13px;
      }
      .banner {
        background: #003366;
        color: #fff;
        padding: 6px 10px;
        font-weight: bold;
      }
      .crumb {
        background: #e6e6e6;
        border-bottom: 1px solid #808080;
        padding: 4px 10px;
      }
      .screen {
        margin: 16px;
        background: #fff;
        border: 2px solid #003366;
      }
      .screen-title {
        background: #003366;
        color: #fff;
        padding: 4px 8px;
      }
      table.form {
        margin: 12px;
      }
      table.form td {
        padding: 4px 8px;
      }
      input[type="text"] {
        width: 160px;
      }
    </style>
  </head>
  <body>
    <div class="banner">Harbor Credit Union — Core CIF</div>
    <div class="crumb">Member Services &gt; Inquiry</div>
    <div class="screen">
      <div class="screen-title">Member Inquiry</div>
      <form method="get" action="member.html">
        <table class="form" cellspacing="0" cellpadding="0">
          <tr>
            <td>
              <label for="memberId">Member ID</label>
            </td>
            <td>
              <input id="memberId" name="memberId" type="text" />
            </td>
          </tr>
          <tr>
            <td></td>
            <td>
              <button type="submit">Search</button>
            </td>
          </tr>
        </table>
      </form>
    </div>
  </body>
</html>
